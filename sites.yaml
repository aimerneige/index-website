# ==============================================================================
# Aimer's Hub - 站点与小工具配置文件
# ==============================================================================
# 修改此文件即可新增、删除或调整你的静态导航页站点。
#
# 支持的字段说明：
# - title: 工具简短英文/主要名称（如 Posta, UUID）
# - name: 工具中文全名或副标题（如 邮寄地址管理与 A4 排版）
# - description: 详细功能说明
# - url: 站点的完整链接（支持 https:// 开头）
# - category: 所属分类 ID，需与下方 categories 中定义的 id 一致
# - icon: 图标名称（支持常见 Lucide 图标名，如 Mail, Image, Hash, FileCode2, KeyRound, Info, Zap, Sparkles, Terminal, Book, Compass 等）
# - color: 主题色强调（如 sky, violet, blue, amber, emerald, teal, rose, indigo）
# - badge: 右上角标签（如 "常用", "纯前端", "v4/v7", 可选）
# - tags: 标签列表，用于分类筛选与关键词模糊检索
# ==============================================================================

meta:
  title: "Aimer's Hub"
  subtitle: "个人小工具与静态站点导航"
  description: "精选轻量、即开即用的纯前端实用小工具合集"
  author: "Aimer"
  domain: "www.aimer.moe"
  github: "https://github.com/aimerneige"

# 分类标签定义（id 为唯一标识符）
categories:
  - id: "all"
    name: "全部工具"
    icon: "Sparkles"
  - id: "dev"
    name: "开发与数据"
    icon: "Code2"
  - id: "media"
    name: "图像与媒体"
    icon: "Image"
  - id: "security"
    name: "安全与凭据"
    icon: "ShieldCheck"
  - id: "office"
    name: "实用与排版"
    icon: "Printer"

# 站点列表
sites:
  - title: "Posta"
    name: "Posta 邮寄排版"
    description: "纯前端邮寄地址管理与标准 A4 标签打印排版工具，支持多规格模版、双语地址智能排版与 JSON 备份导出。"
    url: "https://posta.aimer.moe/"
    category: "office"
    icon: "Mail"
    color: "sky"
    tags: ["办公", "排版", "打印", "A4", "地址簿", "标签"]
    badge: "实用"

  - title: "Gallery"
    name: "Gallery 摄影作品画廊"
    description: "高质感个人摄影作品集与相册浏览，支持大图灯箱预览、无损画质呈现与专业相机 EXIF 参数查看。"
    url: "https://gallery.aimer.moe/"
    category: "media"
    icon: "Image"
    color: "violet"
    tags: ["摄影", "画廊", "相册", "EXIF", "作品集"]

  - title: "UUID"
    name: "UUID 生成与解析器"
    description: "Material Design 风格的 UUID 在线工具，支持 v1-v7 及 NIL/MAX 全版本批量生成、格式校验与元数据解析。"
    url: "https://uuid.aimer.moe/"
    category: "dev"
    icon: "Hash"
    color: "blue"
    tags: ["UUID", "GUID", "v1-v7", "生成器", "解析校验"]
    badge: "v1-v7"

  - title: "JSON"
    name: "JSON Toolbox 百宝箱"
    description: "支持离线安装的纯前端 JSON 工具箱，提供格式化、压缩、差异对比、格式转换、可视化树形视图与校验编辑。"
    url: "https://json.aimer.moe/"
    category: "dev"
    icon: "FileCode2"
    color: "amber"
    tags: ["JSON", "格式化", "对比", "格式转换", "树形视图", "校验"]
    badge: "PWA"

  - title: "PWD"
    name: "PWD 强密码生成器"
    description: "简洁美观的本地强密码生成工具，支持大小写字母、数字及特殊符号灵活组合与强度评估，即开即用零上传。"
    url: "https://pwd.aimer.moe/"
    category: "security"
    icon: "KeyRound"
    color: "emerald"
    tags: ["密码", "安全", "强随机", "凭据生成", "本地计算"]
    badge: "高安全"

  - title: "Meta"
    name: "Meta Reader 图片元数据"
    description: "交互式纯前端图片 EXIF 查看器，可视化读取照片相机机型、光圈快门、ISO、镜头参数及 GPS 拍摄位置。"
    url: "https://meta.aimer.moe/"
    category: "media"
    icon: "Info"
    color: "teal"
    tags: ["EXIF", "元数据", "相机参数", "GPS", "摄影", "图片分析"]
    badge: "EXIF"

  - title: "WebP"
    name: "WebP 本地图片转换器"
    description: "纯本地运行的图片转 WebP 工具，支持 PNG/JPEG/GIF/BMP 批量转换与质量调节，所有计算在浏览器完成，隐私安全。"
    url: "https://webp.aimer.moe/"
    category: "media"
    icon: "Zap"
    color: "rose"
    tags: ["WebP", "图像转换", "图片压缩", "纯本地", "Canvas"]
    badge: "纯本地"

  - title: "Postcard"
    name: "片刻 明信片生成器"
    description: "把喜欢的风景制作成一张精美明信片，支持自定义图片构图缩放、白边文字排版与高清导出，纯本地处理零上传。"
    url: "https://postcard.aimer.moe/"
    category: "media"
    icon: "Palette"
    color: "indigo"
    tags: ["明信片", "图片排版", "摄影", "卡片制作", "纯本地"]
    badge: "纯本地"

  - title: "LoveLive"
    name: "LoveLive 四格漫画引擎"
    description: "非官方静态漫画提示词与图片生成工作台，支持基于 LLM 的四格分镜创作、角色设定管理与全自动生成工作流。"
    url: "https://lovelive.fan/"
    category: "media"
    icon: "Sparkles"
    color: "rose"
    tags: ["LoveLive", "四格漫画", "分镜生成", "提示词", "同人创作", "LLM"]
    badge: "工作台"
